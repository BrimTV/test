<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ульяна CRM: Автономная версия</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; }
        .btn-green { background: #28a745; color: white; }
        .btn-blue { background: #007bff; color: white; }
        .board { display: flex; gap: 20px; overflow-x: auto; }
        .column { flex: 1; min-width: 250px; background: #e9ecef; border-radius: 10px; padding: 15px; min-height: 400px; }
        .column h3 { text-align: center; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #ccc; }
        .col-red h3 { border-color: #dc3545; color: #dc3545; }
        .col-yellow h3 { border-color: #ffc107; color: #d39e00; }
        .col-green h3 { border-color: #28a745; color: #28a745; }
        .col-blue h3 { border-color: #007bff; color: #007bff; }
        .card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h4 { margin: 0 0 5px; }
        .card p { margin: 5px 0; font-size: 14px; color: #666; }
        .status-select { width: 100%; margin-top: 10px; padding: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ CRM Дашборд Ульяны</h1>
        <p><i>Автономная версия (Данные хранятся в вашем браузере)</i></p>
    </div>
    <div class="controls">
        <a href="form.html" class="btn btn-green">➕ Добавить лида</a>
        <button onclick="exportData()" class="btn btn-blue">💾 Скачать Бэкап</button>
    </div>
    <div class="board">
        <div class="column col-red" id="col-red"><h3>🔴 Отказ</h3><div class="container"></div></div>
        <div class="column col-yellow" id="col-yellow"><h3>🟡 Думает</h3><div class="container"></div></div>
        <div class="column col-green" id="col-green"><h3>🟢 Купил</h3><div class="container"></div></div>
        <div class="column col-blue" id="col-blue"><h3>🔵 Повторно</h3><div class="container"></div></div>
    </div>

    <script>
        function loadLeads() {
            const leads = JSON.parse(localStorage.getItem('crm_leads') || '[]');
            document.querySelectorAll('.container').forEach(c => c.innerHTML = '');
            leads.forEach(lead => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h4>${lead.name}</h4>
                    <p>📞 ${lead.phone}</p>
                    <p>💬 ${lead.request}</p>
                    <select class="status-select" onchange="updateStatus('${lead.id}', this.value)">
                        <option value="red" ${lead.status === 'red' ? 'selected' : ''}>🔴 Отказ</option>
                        <option value="yellow" ${lead.status === 'yellow' ? 'selected' : ''}>🟡 Думает</option>
                        <option value="green" ${lead.status === 'green' ? 'selected' : ''}>🟢 Купил</option>
                        <option value="blue" ${lead.status === 'blue' ? 'selected' : ''}>🔵 Повторно</option>
                    </select>
                `;
                document.querySelector(`#col-${lead.status} .container`).appendChild(card);
            });
        }

        function updateStatus(id, newStatus) {
            let leads = JSON.parse(localStorage.getItem('crm_leads') || '[]');
            leads = leads.map(l => l.id === id ? {...l, status: newStatus} : l);
            localStorage.setItem('crm_leads', JSON.stringify(leads));
            loadLeads();
        }

        function exportData() {
            const data = localStorage.getItem('crm_leads') || '[]';
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `crm_backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        window.onload = loadLeads;
        // Проверка новых данных каждые 2 сек (если форма открыта в другой вкладке)
        setInterval(loadLeads, 2000);
    </script>
</body>
</html>
